<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzo thema test</title><style>body{margin:0;font-family:Arial,sans-serif;background:#46178f;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:12px}.card{background:#fff;color:#222;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;height:170px;object-fit:cover}.card b{display:block;padding:10px}</style></head><body><h1 style="padding:12px">Quizzo thema test</h1><div class="grid" id="g"></div><script>const ids=['classic','winter','christmas','spring','summer','autumn','classroom','ocean','space','jungle','sunset','candy','neon','sports','football','basketball','racing','gaming','music','halloween','party','rainbow','arcade','volcano','study'];document.getElementById('g').innerHTML=ids.map(id=>`<div class="card"><img src="themes/${id}.${id==='classic'?'png':'jpg'}" onerror="this.style.opacity=.15"><b>${id}</b></div>`).join('')</script></body></html>
