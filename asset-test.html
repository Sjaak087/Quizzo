<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizzo asset test</title><style>body{font-family:Arial,sans-serif;background:#eee;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:10px;border-radius:12px}.ok{color:#148a3b}.bad{color:#c62828}.thumb{height:120px;display:grid;place-items:center;background:#ddd;border-radius:8px;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.thumb.theme img{width:100%;height:100%}</style></head><body><h1>Quizzo asset test</h1><div id="out">Laden…</div><script type="module">
const appRoot=new URL('./',new URL('./app.js',location.href));
const themes=['classic','winter','christmas','spring','summer','autumn','classroom','ocean','space','jungle','sunset','candy','neon','sports','football','basketball','racing','gaming','music','halloween','party','rainbow','arcade','volcano','study'];
const avatars=Array.from({length:20},(_,i)=>`avatar-${i}.webp`);
const accessories=Array.from({length:20},(_,i)=>`accessory-${i}.webp`);
function test(url,label,cl){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve({url,label,ok:true,cl});img.onerror=()=>resolve({url,label,ok:false,cl});img.src=url+'?v=75'});} 
const jobs=[];themes.forEach(t=>jobs.push(test(new URL(`themes/${t}.${t==='classic'?'png':'jpg'}`,appRoot).href,t,'theme')));avatars.forEach(t=>jobs.push(test(new URL(`avatars/${t}`,appRoot).href,t,'avatar')));accessories.forEach(t=>jobs.push(test(new URL(`avatars/${t}`,appRoot).href,t,'accessory')));
const rs=await Promise.all(jobs);const good=rs.filter(x=>x.ok).length;document.getElementById('out').innerHTML=`<p>${good}/${rs.length} geladen.</p><div class="grid">${rs.map(r=>`<div class="card"><b>${r.label}</b><div class="thumb ${r.cl==='theme'?'theme':''}"><img src="${r.url}?v=75" onerror="this.style.display='none'"></div><div class="${r.ok?'ok':'bad'}">${r.ok?'OK':'404'}</div><small>${r.url}</small></div>`).join('')}</div>`;
</script></body></html>
