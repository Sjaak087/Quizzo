<!doctype html><meta charset="utf-8"><title>Quizzo asset test</title><style>body{font-family:Arial;background:#eee}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.c{background:#fff;padding:10px;border-radius:10px}.c img{width:100%;height:130px;object-fit:contain;background:#eee}</style><h1>Quizzo asset test</h1><div id="g" class="g"></div><script type="module">const base=new URL("./",import.meta.url);const root=document.querySelector('#g');const files=["themes/classic.png","themes/winter.jpg","themes/summer.jpg",...Array.from({length:20},(_,i)=>`avatars/avatar-${i}.webp`),...Array.from({length:20},(_,i)=>`avatars/accessory-${i}.webp`)];for(const f of files){const c=document.createElement('div');c.className='c';const im=new Image();im.src=new URL(f,base).href;im.onload=()=>c.insertAdjacentHTML('beforeend','<b>OK '+f+'</b>');im.onerror=()=>c.insertAdjacentHTML('beforeend','<b style="color:red">FAIL '+f+'<br>'+im.src+'</b>');c.prepend(im);root.append(c)}</script>
