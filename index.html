<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#46178f">
  <title>Quizzo!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎉%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#46178f;color:#fff;font-family:sans-serif;font-weight:800}#app>.wait{padding:40px;text-align:center;font-size:24px}.err{max-width:560px;margin:40px auto;background:#fff;color:#333;padding:24px;border-radius:10px;font-weight:600}</style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><div class="wait">Laden...</div></div>
  <script>
  (function () {
    var app = document.getElementById("app");
    function fail(msg) { app.innerHTML = '<div class="err"><h2>Quizzo kan niet starten</h2><p>' + msg + '</p></div>'; }
    window.quizzoFail = fail;
    if (location.protocol === "file:") {
      return fail('Je hebt het bestand direct op je computer geopend. Open de site via je GitHub Pages-link (https://jouwnaam.github.io/reponaam/) of start een lokale server met <code>python3 -m http.server</code> en ga naar <code>http://localhost:8000</code>.');
    }
    window.addEventListener("error", function (e) {
      if (!window.__quizzoStarted) fail("Fout in de code: " + (e.message || "onbekend") + (e.filename ? " (" + e.filename + ")" : ""));
    });
    setTimeout(function () {
      if (!window.__quizzoStarted) fail('De app is niet geladen. Controleer of <code>app.js</code>, <code>firebase.js</code> en <code>style.css</code> naast <code>index.html</code> in je repo staan en open de site via de GitHub Pages-link, niet via een voorbeeld of de zip. Zie F12 > Console voor de exacte fout.');
    }, 4000);
  })();
  </script>
  <script type="module" src="app.js" onerror="quizzoFail('app.js is niet gevonden. Upload alle bestanden uit de zip naar de hoofdmap van je repo.')"></script>
</body>
</html>
