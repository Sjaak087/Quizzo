<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#46178f">
  <title>Quizzo!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body{margin:0;background:#46178f;color:#fff;font-family:Montserrat,sans-serif;font-weight:800}
    #app>.wait{padding:40px;text-align:center;font-size:24px}
    .err{max-width:680px;margin:40px auto;background:#fff;color:#333;padding:24px;border-radius:12px;font-weight:600;box-shadow:0 6px 0 rgba(0,0,0,.2)}
    .err code{background:#f1ebfa;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <div id="app"><div class="wait">Laden...</div></div>
  <script>
    (function(){
      const app=document.getElementById('app');
      const fail=(msg)=>{if(app && !app.dataset.failed){app.dataset.failed='1';app.innerHTML='<div class="err"><h2>Quizzo kan niet starten</h2><p>'+msg+'</p><p>Controleer of <code>index.html</code>, <code>app.js</code>, <code>firebase.js</code>, <code>style.css</code> en <code>avatars.js</code> naast elkaar staan.</p></div>';}};
      window.quizzoFail=fail;
      window.addEventListener('error',e=>{if(!window.__quizzoStarted)fail('Fout: '+(e.message||'onbekende fout'));});
      window.addEventListener('unhandledrejection',e=>{if(!window.__quizzoStarted)fail('Fout: '+(e.reason?.message||e.reason||'onbekende fout'));});
    })();
  </script>
  <script src="avatars.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
