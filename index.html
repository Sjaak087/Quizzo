<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#46178f"><title>Quizzo!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="./style.css?v=91"><script src="./maintenance.js?v=91"></script><style>html.quizzo-maintenance-locked,html.quizzo-maintenance-locked body{overflow:hidden!important}#quizzo-maintenance{position:fixed;inset:0;z-index:2147483647;font-family:Montserrat,system-ui,sans-serif}.maintenance-screen{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#46178f,#24104f);padding:24px;box-sizing:border-box}.maintenance-card{width:min(620px,calc(100vw - 48px));box-sizing:border-box;background:#fff;color:#30214d;border-radius:28px;padding:44px 34px 38px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35)}.maintenance-logo{font-weight:900;letter-spacing:.16em;color:#46178f;font-size:15px;margin-bottom:18px}.maintenance-icon{font-size:54px;line-height:1;margin-bottom:18px}.maintenance-card h1{margin:0 0 14px;font-size:clamp(30px,5vw,48px);line-height:1.05;font-weight:900}.maintenance-card p{margin:0 auto 28px;max-width:480px;font-size:18px;line-height:1.5;color:#6c6380;font-weight:700}.maintenance-login-btn,.maintenance-submit,.maintenance-cancel{border:0;border-radius:13px;padding:11px 20px;font:800 16px Montserrat,system-ui,sans-serif;cursor:pointer}.maintenance-login-btn{background:#46178f;color:#fff;box-shadow:0 5px 0 #311061}.maintenance-modal{position:absolute;inset:0;background:rgba(18,8,37,.68);display:grid;place-items:center;padding:20px;box-sizing:border-box}.maintenance-modal[hidden]{display:none!important}.maintenance-login-card{width:min(420px,calc(100vw - 40px));box-sizing:border-box;background:#fff;color:#30214d;border-radius:22px;padding:28px; intenanceLoginBtn').onclick=function(){m.hidden=false;i.focus()};document.getElementById('maintenanceCancel').onclick=function(){m.hidden=true;i.value='';e.textContent=''};document.getElementById('maintenanceLoginForm').onsubmit=function(x){x.preventDefault();if(i.value===c.password){o.remove();document.documentElement.classList.remove('quizzo-maintenance-locked')}else{e.textContent='Wachtwoord klopt niet.';i.focus();i.select()}}})();</script><script defer src="./avatars.js?v=91"></script><script type="module" src="./app.js?v=91"></script></body></html>
